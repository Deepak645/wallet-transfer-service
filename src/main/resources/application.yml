server:
  port: ${PORT:8080}

spring:
  application:
    name: wallet-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/wallet}
    username: ${SPRING_DATASOURCE_USERNAME:wallet}
    password: ${SPRING_DATASOURCE_PASSWORD:wallet}
  flyway:
    enabled: true
    locations: classpath:db/migration

management:
  endpoints:
    web:
      base-path: /
      exposure:
        include: health,prometheus
      path-mapping:
        prometheus: metrics
  endpoint:
    health:
      show-details: always
  prometheus:
    metrics:
      export:
        enabled: true
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true

# TEST INFRASTRUCTURE ONLY (see README "Test funding endpoint"). Disabled
# and tokenless by default - both must be set for /test/wallets/{id}/fund
# to exist at all. Never put a real token here; set TEST_FUNDING_TOKEN as
# an environment variable on the deployment instead.
test:
  funding:
    enabled: ${TEST_FUNDING_ENABLED:false}
    token: ${TEST_FUNDING_TOKEN:}
