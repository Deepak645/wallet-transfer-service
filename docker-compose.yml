services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-wallet}
      POSTGRES_USER: ${POSTGRES_USER:-wallet}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-wallet}
    ports:
      - "5432:5432"
    volumes:
      - wallet_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-wallet} -d ${POSTGRES_DB:-wallet}"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-wallet}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-wallet}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-wallet}
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

volumes:
  wallet_pgdata:
